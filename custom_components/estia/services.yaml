set_slot:
  fields:
    config_entry_id:
      required: true
      selector:
        config_entry:
          integration: estia
    profile_id:
      required: true
      example: "default"
      selector:
        text:
    slot_id:
      required: true
      example: "slot1"
      selector:
        text:
    start:
      required: true
      example: "06:30"
      selector:
        time:
    setpoint:
      required: true
      example: 20.5
      selector:
        number:
          min: 5
          max: 35
          step: 0.1
          unit_of_measurement: "°C"
          mode: box

