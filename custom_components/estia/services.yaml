assign_day:
  fields:
    config_entry_id:
      required: true
      selector:
        config_entry:
          integration: estia
    profile_id:
      required: true
      example: "default"
      selector:
        text:
    day:
      required: true
      example: "saturday"
      selector:
        select:
          translation_key: weekday
          options:
            - monday
            - tuesday
            - wednesday
            - thursday
            - friday
            - saturday
            - sunday

resume:
  fields:
